- id: '1789173277049'
  alias: Kitchen - Motion Lighting
  description: Turn kitchen lights on based on ambient illuminance when motion is
    detected.
  triggers:
  - trigger: state
    entity_id: binary_sensor.kitchen_third_reality_motion
    from: 'off'
    to: 'on'
  conditions:
  - condition: state
    entity_id: light.kitchen_light_main
    state: 'off'
  - condition: state
    entity_id: light.kitchen_light_sink
    state: 'off'
  actions:
  - variables:
      kitchen_lux: '{{ states(''sensor.kitchen_third_reality_illuminance'') | float(999)
        }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ kitchen_lux <= 20 }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id:
          - light.kitchen_light_main
          - light.kitchen_light_sink
        data:
          brightness_pct: 25
    - conditions:
      - condition: template
        value_template: '{{ kitchen_lux <= 50 }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id:
          - light.kitchen_light_main
          - light.kitchen_light_sink
        data:
          brightness_pct: 20
    - conditions:
      - condition: template
        value_template: '{{ kitchen_lux <= 80 }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id:
          - light.kitchen_light_main
          - light.kitchen_light_sink
        data:
          brightness_pct: 15
  mode: single
- id: '1789173669795'
  alias: Kitchen - Hard Light Cutoff
  description: Turn kitchen lights off after 30 minutes as a safety cutoff.
  triggers:
  - trigger: state
    entity_id:
    - light.kitchen_light_main
    - light.kitchen_light_sink
    to:
    - 'on'
    for:
      hours: 0
      minutes: 30
      seconds: 0
  conditions: []
  actions:
  - action: light.turn_off
    target:
      entity_id:
      - light.kitchen_light_main
      - light.kitchen_light_sink
    data: {}
  mode: restart
- id: '1789174230279'
  alias: Kitchen - No Motion Shutoff
  description: Turn both kitchen lights off after no motion has been detected for
    5 minutes.
  triggers:
  - trigger: state
    entity_id: binary_sensor.kitchen_third_reality_motion
    from: 'on'
    to: 'off'
    for:
      minutes: 5
  conditions: []
  actions:
  - action: light.turn_off
    target:
      entity_id:
      - light.kitchen_light_main
      - light.kitchen_light_sink
  mode: restart
