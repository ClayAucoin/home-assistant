  actions:
  - action: notify.mobile_app_bub_s_phone
    data:
      title: Washing Machine
      message: The washing machine has finished.
  mode: restart
- id: '1791413630439'
  alias: Laundry - Dryer - Finished
  description: Notify me when the dryer stops moving for 3 minutes.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.back_house_multi_sensor_on_dryer_accelerometer
    from: 'on'
    to: 'off'
    for:
      minutes: 3
  conditions: []
  actions:
  - action: notify.mobile_app_bub_s_phone
    data:
      title: Dryer
      message: The dryer has finished.
  mode: restart
- id: '1791926865580'
  alias: Changing Area - Privacy Position
  description: 'Return to Guard immediately when the door opens. Move to Privacy when
    the door closes while the mat is occupied. Ignore new mat activations during the
    10-second door pause. Return to Guard after the mat is vacant for 10 seconds.

    '
  triggers:
  - trigger: state
    entity_id: binary_sensor.smart_things_multiv4_bub_s_door
    to: 'on'
    id: door_opened
  - trigger: state
    entity_id: binary_sensor.smart_things_multiv4_bub_s_door
    from: 'on'
    to: 'off'
    id: door_closed
  - trigger: state
    entity_id: binary_sensor.bub_s_room_changing_area_occupancy
    to: 'on'
    id: privacy
  - trigger: state
    entity_id: binary_sensor.bub_s_room_changing_area_occupancy
    to: 'off'
    for:
      seconds: 10
    id: normal
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: door_opened
      sequence:
      - action: select.select_option
        target:
          entity_id: select.bub_s_room_back_office_inside_ptz_preset
        data:
          option: '1'
      - action: timer.start
        target:
          entity_id: timer.changing_area_door_pause
        data:
          duration: 00:00:10
    - conditions:
      - condition: state
        entity_id: binary_sensor.smart_things_multiv4_bub_s_door
        state: 'off'
      - condition: state
        entity_id: binary_sensor.bub_s_room_changing_area_occupancy
        state: 'on'
      - condition: or
        conditions:
        - condition: trigger
          id: door_closed
        - condition: and
          conditions:
          - condition: trigger
            id: privacy
          - condition: state
            entity_id: timer.changing_area_door_pause
            state: idle
      sequence:
      - action: select.select_option
        target:
          entity_id: select.bub_s_room_back_office_inside_ptz_preset
        data:
          option: '0'
    - conditions:
      - condition: trigger
        id: normal
      - condition: state
        entity_id: binary_sensor.bub_s_room_changing_area_occupancy
        state: 'off'
      sequence:
      - action: select.select_option
        target:
          entity_id: select.bub_s_room_back_office_inside_ptz_preset
        data:
          option: '1'
  mode: queued
  max: 10
- id: '1792929194380'
  alias: Bub's Room - Arrival and Departure
  description: 'Control bedroom lights, AC, and monitors based on SmartThings Arrival
    Sensor presence.

    '
  triggers:
  - trigger: state
    entity_id: device_tracker.bub_s_arrival_tag_device_scanner
    from: home
    to: not_home
    id: leaving
  - trigger: state
    entity_id: device_tracker.bub_s_arrival_tag_device_scanner
    from: not_home
    to: home
    id: arriving
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: leaving
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.bub_s_room_bub_s_lights
      - action: climate.set_temperature
        target:
          entity_id: climate.bub_s_ac
        data:
          temperature: 72
      - delay: 00:15:00
      - condition: state
        entity_id: device_tracker.bub_s_arrival_tag_device_scanner
        state: not_home
      - action: switch.turn_off
        target:
          entity_id:
          - switch.bub_s_room_monitors_ihome_outlet_samsung_widescreen
          - switch.bub_s_room_monitors_ihome_samsung_m5_and_msi
    - conditions:
      - condition: trigger
        id: arriving
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.bub_s_room_bub_s_lights
        data:
          brightness_pct: 100
      - action: climate.set_temperature
        target:
          entity_id: climate.bub_s_ac
        data:
          temperature: 70
      - action: switch.turn_on
        target:
          entity_id: switch.bub_s_room_monitors_ihome_outlet_samsung_widescreen
      - delay: 00:00:03
      - action: switch.turn_on
        target:
          entity_id: switch.bub_s_room_monitors_ihome_samsung_m5_and_msi
  mode: restart
- id: '1792997783057'
  alias: Bub's Room - Camera Privacy LED Indicator
  description: 'Change monitor LEDs to red when Home Assistant commands Privacy, and
    blue when it commands Guard. Preserve current brightness.

    '
  triggers:
  - trigger: event
    event_type: call_service
    event_data:
      domain: select
      service: select_option
  conditions:
  - condition: template
    value_template: "{% set entities =\n  trigger.event.data.service_data.get('entity_id',
      []) %}\n{% set camera =\n  'select.bub_s_room_back_office_inside_ptz_preset'
      %}\n{{ entities == camera if entities is string\n   else camera in entities
      }}\n"
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.service_data.get(''option'') | string
          == ''1'' }}

          '
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.bub_s_room_bub_s_leds
        data:
          rgb_color:
          - 0
          - 0
          - 255
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.service_data.get(''option'') | string
          == ''0'' }}

          '
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.bub_s_room_bub_s_leds
        data:
          rgb_color:
          - 0
          - 255
          - 0
  mode: queued
  max: 10
- id: '1793360314571'
  alias: Amazfit T-Rex 3 - Low Battery Alert
  description: Notify when watch battery reaches 20% or below, including after Home
    Assistant restarts.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.t_rex_3_battery
    below: 21
    id: low_battery
  - trigger: homeassistant
    event: start
    id: ha_restart
  conditions:
  - condition: numeric_state
    entity_id: sensor.t_rex_3_battery
    below: 21
  actions:
  - action: notify.mobile_app_sm_g988u1
    data:
      title: T-Rex 3 Battery Low
      message: Your Amazfit T-Rex 3 battery is at {{ states('sensor.t_rex_3_battery')
        }}%. Time to charge your watch!
  mode: single
- id: '1793469643730'
  alias: Front Room - Motion Lighting
  description: 'Turn on the front room light at 50% when motion is detected, the light
    is off, and kitchen illuminance is 50 lux or lower. Preserve brightness if the
    light is already on. Turn off after 5 minutes without motion.

    '
  triggers:
  - trigger: state
    entity_id: binary_sensor.front_room_third_reality_motion_sensor
    to: 'on'
    id: motion_detected
  - trigger: state
    entity_id: binary_sensor.front_room_third_reality_motion_sensor
    to: 'off'
    for:
      minutes: 5
    id: motion_cleared
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: motion_detected
      - condition: state
        entity_id: light.front_room_front_room_light
        state: 'off'
      - condition: numeric_state
        entity_id: sensor.kitchen_third_reality_illuminance
        below: 51
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.front_room_front_room_light
        data:
          brightness_pct: 50
    - conditions:
      - condition: trigger
        id: motion_cleared
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.front_room_front_room_light
  mode: restart
- id: '1793475496481'
  alias: Porch - Automatic Lighting
  description: Turn porch lights on at sunset and off at 10 PM.
  triggers:
  - trigger: sun
    event: sunset
    id: sunset
  - trigger: time
    at: '22:00:00'
    id: lights_off
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: sunset
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.porch_lights
    - conditions:
      - condition: trigger
        id: lights_off
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.porch_color_cycling
      - action: script.turn_off
        target:
          entity_id: script.porch_color_cycling
      - action: light.turn_off
        target:
          entity_id: light.porch_lights
  mode: single
- id: '1793475588432'
  alias: Porch - Color Cycling Control
  description: Start or stop the porch color cycling script.
  triggers:
  - trigger: state
    entity_id: input_boolean.porch_color_cycling
    to: 'on'
    id: start
  - trigger: state
    entity_id: input_boolean.porch_color_cycling
    to: 'off'
    id: stop
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: start
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.porch_color_cycling
    - conditions:
      - condition: trigger
        id: stop
      sequence:
      - action: script.turn_off
        target:
          entity_id: script.porch_color_cycling
  mode: restart
- id: '1793731159847'
  alias: Porch - Aqara H2 Smart Bulb Control
  description: 'Control both Philips Hue porch bulbs using the Aqara H2 in Decoupled
    Mode. Power toggles the lights and stops color cycling when active. Up and Down
    adjust brightness by 10% without changing their colors.

    '
  triggers:
  - trigger: event
    event_type: zha_event
    event_data:
      device_ieee: 54:ef:44:10:01:81:bc:4c
      command: 1_single
    id: power
  - trigger: event
    event_type: zha_event
    event_data:
      device_ieee: 54:ef:44:10:01:81:bc:4c
      command: 2_single
    id: brightness_up
  - trigger: event
    event_type: zha_event
    event_data:
      device_ieee: 54:ef:44:10:01:81:bc:4c
      command: 3_single
    id: brightness_down
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: power
      sequence:
      - if:
        - condition: state
          entity_id: input_boolean.porch_color_cycling
          state: 'on'
        then:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.porch_color_cycling
        - action: script.turn_off
          target:
            entity_id: script.porch_color_cycling
      - action: light.toggle
        target:
          entity_id: light.porch_lights
    - conditions:
      - condition: trigger
        id: brightness_up
      - condition: state
        entity_id: light.porch_lights
        state: 'on'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.porch_lights
        data:
          brightness: '{{ [255, (state_attr(''light.porch_lights'', ''brightness'')
            | int(255)) + 26] | min }}

            '
    - conditions:
      - condition: trigger
        id: brightness_down
      - condition: state
        entity_id: light.porch_lights
        state: 'on'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.porch_lights
        data:
          brightness: '{{ [3, (state_attr(''light.porch_lights'', ''brightness'')
            | int(255)) - 26] | max }}

            '
  mode: queued
  max: 10
- id: '1793734700194'
  alias: Porch - Aqara H2 Indicator Sync
  description: 'Synchronize the Aqara H2 green indicator with the Philips Hue porch
    bulbs without changing the dimmer output.

    '
  triggers:
  - trigger: state
    entity_id: light.porch_lights
    to: 'on'
  - trigger: state
    entity_id: light.porch_lights
    to: 'off'
  - trigger: homeassistant
    event: start
  conditions:
  - condition: template
    value_template: '{{ states(''light.porch_lights'') in [''on'', ''off''] }}

      '
  actions:
  - action: zha.set_zigbee_cluster_attribute
    data:
      ieee: 54:ef:44:10:01:81:bc:4c
      endpoint_id: 1
      cluster_id: 64704
      cluster_type: in
      attribute: 515
      value: '{{ 1 if is_state(''light.porch_lights'', ''on'') else 0 }}'
  mode: restart
- id: '1794193698739'
  alias: Bub's Room - WLED Mode and Brightness
  description: 'Control WLED based on changing-area occupancy, door state, camera
    privacy position, and Bedtime Mode.

    '
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.bub_s_room_changing_area_occupancy
    - binary_sensor.smart_things_multiv4_bub_s_door
    - input_boolean.bedtime_mode
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.changing_area_door_pause
  - trigger: homeassistant
    event: start
  actions:
  - variables:
      privacy_mode: "{{ is_state('binary_sensor.bub_s_room_changing_area_occupancy',
        'on')\n   and is_state('binary_sensor.smart_things_multiv4_bub_s_door', 'off')\n
        \  and is_state('timer.changing_area_door_pause', 'idle') }}\n"
      bedtime: '{{ is_state(''input_boolean.bedtime_mode'', ''on'') }}

        '
      target_preset: "{{ 'Changing Area Chase' if privacy_mode\n   else 'Normal Blue'
        }}\n"
      target_brightness: "{% if privacy_mode %}\n  {{ 4 if bedtime else 20 }}\n{%
        else %}\n  {{ 1 if bedtime else 20 }}\n{% endif %}\n"
  - action: select.select_option
    target:
      entity_id: select.bub_s_room_bub_s_leds_preset
    data:
      option: '{{ target_preset }}'
  - delay:
      seconds: 1
  - action: light.turn_on
    target:
      entity_id: light.bub_s_room_bub_s_leds
    data:
      brightness_pct: '{{ target_brightness | int }}'
  mode: restart
