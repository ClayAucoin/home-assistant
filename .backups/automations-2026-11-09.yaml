- id: '1790634319405'
  alias: Office Sign - Class Calendar
  description: ''
  triggers:
  - trigger: time_pattern
    minutes: /1
    id: calendar_tick
  - trigger: time_pattern
    minutes: /2
    id: calendar_refresh
  - trigger: state
    entity_id: binary_sensor.video_call_bridge_video_call
    from: 'off'
    to: 'on'
    id: video_call_started
  - trigger: state
    entity_id: binary_sensor.video_call_bridge_video_call
    from: 'on'
    to: 'off'
    id: video_call_ended
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''calendar_refresh'' }}'
      sequence:
      - action: homeassistant.update_entity
        target:
          entity_id: calendar.class
  - action: calendar.get_events
    metadata: {}
    target:
      entity_id: calendar.class
    data:
      start_date_time: '{{ now() - timedelta(hours=1) }}'
      duration:
        hours: 25
        minutes: 0
        seconds: 0
    response_variable: calendar_events
  - variables:
      lead_minutes: '{{ states(''input_number.office_sign_calendar_lead_time'') |
        int(5) }}'
      grace_minutes: '{{ states(''input_number.office_sign_calendar_grace_period'')
        | int(5) }}'
      reconnect_minutes: '{{ states(''input_number.office_sign_video_call_reconnect_grace'')
        | int(5) }}'
      show_end_time: '{{ is_state(''input_boolean.office_sign_show_end_time'', ''on'')
        }}'
      video_call_active: '{{ is_state(''binary_sensor.video_call_bridge_video_call'',
        ''on'') }}'
      events: '{{ calendar_events[''calendar.class''][''events''] }}'
  - variables:
      calendar_info: "{% set ns = namespace(\n  current_found=false,\n  current_start=none,\n
        \ current_end=none,\n  block_active=false,\n  block_end=none\n) %}\n{% set
        current = now() %} {% set lead = timedelta(minutes=lead_minutes | int) %}
        {% set grace = timedelta(minutes=grace_minutes | int) %}\n{% for event in
        events %}\n  {% set event_start = as_datetime(event.start) | as_local %}\n
        \ {% set event_end = as_datetime(event.end) | as_local %}\n\n  {# Find the
        individual event that currently owns the sign. #}\n  {% if not ns.current_found
        %}\n    {% if current >= event_start - lead\n          and current < event_end
        %}\n      {% set ns.current_found = true %}\n      {% set ns.current_start
        = event_start %}\n      {% set ns.current_end = event_end %}\n    {% endif
        %}\n  {% endif %}\n\n  {# Find the active continuous calendar block. #}\n
        \ {% if not ns.block_active %}\n    {% if current >= event_start - lead\n
        \         and current <= event_end + grace %}\n      {% set ns.block_active
        = true %}\n      {% set ns.block_end = event_end %}\n    {% endif %}\n  {%
        else %}\n    {% if event_start <= ns.block_end + grace %}\n      {% if event_end
        > ns.block_end %}\n        {% set ns.block_end = event_end %}\n      {% endif
        %}\n    {% endif %}\n  {% endif %}\n{% endfor %}\n{{ {\n  'current_found':
        ns.current_found,\n  'current_start': ns.current_start.isoformat()\n    if
        ns.current_start is not none else '',\n  'current_end': ns.current_end.isoformat()\n
        \   if ns.current_end is not none else '',\n  'block_active': ns.block_active,\n
        \ 'block_end': ns.block_end.isoformat()\n    if ns.block_end is not none else
        ''\n} }}"
  - variables:
      video_call_off_minutes: "{% if not video_call_active %}\n  {{\n    (\n      as_timestamp(now())\n
        \     -\n      as_timestamp(\n        states.binary_sensor.video_call_bridge_video_call.last_changed\n
        \     )\n    ) / 60\n  }}\n{% else %}\n  0\n{% endif %}"
      ended_event_end: '{{ states(''input_text.office_sign_early_ended_event_end'')
        }}'
      current_event_ended_early: "{{\n  calendar_info.current_found\n  and ended_event_end
        not in ['', 'unknown', 'unavailable']\n  and calendar_info.current_end ==
        ended_event_end\n}}"
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.office_sign_calendar_automation
        state: 'on'
      - condition: template
        value_template: '{{ calendar_info.current_found }}'
      - condition: template
        value_template: '{{ not current_event_ended_early }}'
      - condition: template
        value_template: '{{ video_call_active }}'
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.office_sign_video_call_seen
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.office_sign_calendar_automation
        state: 'on'
      - condition: template
        value_template: '{{ calendar_info.current_found }}'
      - condition: template
        value_template: '{{ not current_event_ended_early }}'
      - condition: state
        entity_id: input_boolean.office_sign_video_call_seen
        state: 'on'
      - condition: template
        value_template: '{{ not video_call_active }}'
      - condition: template
        value_template: "{{ video_call_off_minutes | float(0)\n   >= reconnect_minutes
          | float(5) }}"
      sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.office_sign_early_ended_event_end
        data:
          value: '{{ calendar_info.current_end }}'
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.office_sign_video_call_seen
  - variables:
      active_event_ended_early: "{% set ended =\n  states('input_text.office_sign_early_ended_event_end')
        %}\n\n{{\n  ended not in ['', 'unknown', 'unavailable']\n  and\n  (\n    (\n
        \     calendar_info.current_found\n      and calendar_info.current_end ==
        ended\n    )\n    or\n    (\n      not calendar_info.current_found\n      and
        calendar_info.block_active\n      and calendar_info.block_end == ended\n    )\n
        \ )\n}}"
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.office_sign_calendar_automation
        state: 'on'
      - condition: template
        value_template: '{{ calendar_info.block_active }}'
      - condition: template
        value_template: '{{ not active_event_ended_early }}'
      sequence:
      - choose:
        - conditions:
          - condition: state
            entity_id: input_boolean.office_sign_calendar_active
            state: 'off'
          sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.office_sign_calendar_active
      - variables:
          sign_message: "{% if show_end_time %}\n  {% set end_time =\n    as_datetime(calendar_info.block_end)
            | as_local %}\n\n  {% if end_time.minute == 0 %}\n    {% set formatted_end
            = end_time.strftime('%-I') %}\n  {% else %}\n    {% set formatted_end
            = end_time.strftime('%-I:%M') %}\n  {% endif %}\n\n  {{ 'IN CLASS\\nTIL
            ' ~ formatted_end }}\n{% else %}\n  {{ 'IN CLASS' }}\n{% endif %}"
      - action: switch.turn_on
        target:
          entity_id: switch.office_sign_display_power
      - action: mqtt.publish
        metadata: {}
        data:
          evaluate_payload: false
          qos: '0'
          topic: office/sign/config/render_preset
          payload: IN CLASS
      - action: mqtt.publish
        metadata: {}
        data:
          evaluate_payload: false
          qos: '0'
          topic: office/sign/render_message
          payload: '{{ sign_message }}'
    - conditions:
      - condition: template
        value_template: '{{ video_call_active }}'
      - condition: template
        value_template: "{{\n  not (\n    is_state(\n      'input_boolean.office_sign_calendar_automation',\n
          \     'on'\n    )\n    and calendar_info.block_active\n    and not active_event_ended_early\n
          \ )\n}}"
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.office_sign_display_power
      - action: mqtt.publish
        metadata: {}
        data:
          evaluate_payload: false
          qos: '0'
          topic: office/sign/config/render_preset
          payload: VIDEO CALL
      - action: mqtt.publish
        metadata: {}
        data:
          evaluate_payload: false
          qos: '0'
          topic: office/sign/render_message
          payload: VIDEO CALL
    default:
    - choose:
      - conditions:
        - condition: state
          entity_id: input_boolean.office_sign_calendar_active
          state: 'on'
        sequence:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.office_sign_calendar_active
        - action: switch.turn_off
          target:
            entity_id: switch.office_sign_display_power
        - action: mqtt.publish
          metadata: {}
          data:
            evaluate_payload: false
            qos: '0'
            topic: office/sign/render_message
            payload: ''
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ trigger.id == ''video_call_ended'' }}'
        - condition: template
          value_template: "{{\n  not (\n    is_state(\n      'input_boolean.office_sign_calendar_automation',\n
            \     'on'\n    )\n    and calendar_info.block_active\n    and not active_event_ended_early\n
            \ )\n}}"
        sequence:
        - action: switch.turn_off
          target:
            entity_id: switch.office_sign_display_power
        - action: mqtt.publish
          metadata: {}
          data:
            evaluate_payload: false
            qos: '0'
            topic: office/sign/render_message
            payload: ''
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ not calendar_info.block_active }}'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id:
          - input_boolean.office_sign_calendar_active
          - input_boolean.office_sign_video_call_seen
      - action: input_text.set_value
        target:
          entity_id: input_text.office_sign_early_ended_event_end
        data:
          value: ''
  mode: queued
  max: 10
- id: '1790696252627'
  alias: Wi-Fi Log - Bub's Phone - Wheats Connections & Disconnections
  description: Log connections and disconnections from the Wheats work Wi-Fi network.
  triggers:
  - trigger: state
    entity_id: sensor.bub_s_phone_wi_fi_connection
  conditions:
  - condition: template
    value_template: "{{ trigger.from_state is not none\n   and trigger.to_state is
      not none\n   and trigger.from_state.state not in ['unknown', 'unavailable',
      '']\n   and trigger.to_state.state not in ['unknown', 'unavailable', '']\n   and
      trigger.from_state.state != trigger.to_state.state }}\n"
  actions:
  - variables:
      from_wifi: '{{ trigger.from_state.state }}'
      to_wifi: '{{ trigger.to_state.state }}'
      from_tracked: '{{ from_wifi == ''Wheats'' }}

        '
      to_tracked: '{{ to_wifi == ''Wheats'' }}

        '
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ to_tracked and not from_tracked }}'
      sequence:
      - action: google_sheets.append_sheet
        data:
          add_created_column: false
          config_entry: 01M3PTV2QKS8G163WA02Z42EPJ
          worksheet: Time Sheet Data
          data:
            Timestamp: '{{ now().strftime(''%m/%d/%Y %-I:%M %p'') }}'
            Date: '{{ now().strftime(''%m/%d/%Y'') }}'
            Event: Connected
            Wi‑Fi Network: '{{ to_wifi }}'
    - conditions:
      - condition: template
        value_template: '{{ from_tracked and not to_tracked }}'
      sequence:
      - action: google_sheets.append_sheet
        data:
          add_created_column: false
          config_entry: 01M3PTV2QKS8G163WA02Z42EPJ
          worksheet: Time Sheet Data
          data:
            Timestamp: '{{ now().strftime(''%m/%d/%Y %-I:%M %p'') }}'
            Date: '{{ now().strftime(''%m/%d/%Y'') }}'
            Event: Disconnected
            Wi‑Fi Network: '{{ from_wifi }}'
    - conditions:
      - condition: template
        value_template: '{{ from_tracked and to_tracked and from_wifi != to_wifi }}'
      sequence:
      - action: google_sheets.append_sheet
        data:
          add_created_column: false
          config_entry: 01M3PTV2QKS8G163WA02Z42EPJ
          worksheet: Time Sheet Data
          data:
            Timestamp: '{{ now().strftime(''%m/%d/%Y %-I:%M %p'') }}'
            Date: '{{ now().strftime(''%m/%d/%Y'') }}'
            Event: Disconnected
            Wi‑Fi Network: '{{ from_wifi }}'
      - action: google_sheets.append_sheet
        data:
          add_created_column: false
          config_entry: 01M3PTV2QKS8G163WA02Z42EPJ
          worksheet: Time Sheet Data
- id: '1791135453571'
  alias: Wi-Fi Log - Bub's Phone - All Wi-Fi Connections & Disconnections
  description: Log all Wi-Fi connections and disconnections.
  triggers:
  - trigger: state
    entity_id: sensor.bub_s_phone_wi_fi_connection
  conditions:
  - condition: template
    value_template: "{{ trigger.from_state is not none\n   and trigger.to_state is
      not none\n   and trigger.from_state.state != trigger.to_state.state }}\n"
  actions:
  - variables:
      from_wifi: '{{ trigger.from_state.state }}'
      to_wifi: '{{ trigger.to_state.state }}'
      invalid_states:
      - unknown
      - unavailable
      - ''
  - if:
    - condition: template
      value_template: '{{ from_wifi not in invalid_states }}'
    then:
    - action: google_sheets.append_sheet
      data:
        add_created_column: false
        config_entry: 01M43YMMWZPACJWR4TCWA5DC3N
        worksheet: Time Sheet Data
        data:
          Timestamp: '{{ now().strftime(''%m/%d/%Y %-I:%M %p'') }}'
          Date: '{{ now().strftime(''%m/%d/%Y'') }}'
          Event: Disconnected
          Wi-Fi Network: '{{ from_wifi }}'
  - if:
    - condition: template
      value_template: '{{ to_wifi not in invalid_states }}'
    then:
    - action: google_sheets.append_sheet
      data:
        add_created_column: false
        config_entry: 01M43YMMWZPACJWR4TCWA5DC3N
        worksheet: Time Sheet Data
        data:
          Timestamp: '{{ now().strftime(''%m/%d/%Y %-I:%M %p'') }}'
          Date: '{{ now().strftime(''%m/%d/%Y'') }}'
          Event: Connected
          Wi-Fi Network: '{{ to_wifi }}'
  mode: queued
  max: 10
- id: '1791265326515'
  alias: Front Door - Auto Lock
  description: 'Lock the front door 1 minute after unlocking from 7 PM to 7 AM, or
    10 minutes after unlocking from 7 AM to 7 PM.

    '
  triggers:
  - trigger: state
    entity_id: lock.front_door
    to: unlocked
    id: unlocked
  - trigger: state
    entity_id: lock.front_door
    to: locked
    id: locked
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.front_door_auto_lock
    id: timer_finished
  - trigger: homeassistant
    event: start
    id: ha_started
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: unlocked
      sequence:
      - action: timer.start
        target:
          entity_id: timer.front_door_auto_lock
        data:
          duration: "{% if now().hour >= 19 or now().hour < 7 %}\n  00:01:00\n{% else
            %}\n  00:10:00\n{% endif %}\n"
    - conditions:
      - condition: trigger
        id: locked
      sequence:
      - action: timer.cancel
        target:
          entity_id: timer.front_door_auto_lock
    - conditions:
      - condition: trigger
        id: timer_finished
      - condition: state
        entity_id: lock.front_door
        state: unlocked
      sequence:
      - action: lock.lock
        target:
          entity_id: lock.front_door
    - conditions:
      - condition: trigger
        id: ha_started
      - condition: state
        entity_id: lock.front_door
        state: unlocked
      sequence:
      - delay: 00:00:15
      - condition: state
        entity_id: lock.front_door
        state: unlocked
      - action: timer.start
        target:
          entity_id: timer.front_door_auto_lock
        data:
          duration: "{% if now().hour >= 19 or now().hour < 7 %}\n  00:01:00\n{% else
            %}\n  00:10:00\n{% endif %}\n"
  mode: restart
